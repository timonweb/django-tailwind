[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-tailwind"
version = "4.6.0"
description = "Tailwind CSS Framework for Django projects"
readme = "README.md"
keywords = [
    "css",
    "django",
    "tailwind",
]
license = "MIT"
authors = [ { name = "Tim Kamanin", email = "tim@timonweb.com" } ]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [ "django>=5.2", "pytailwindcss>=0.3.1" ]
optional-dependencies.cookiecutter = [ "cookiecutter>=2.7.1,<3" ]
optional-dependencies.honcho = [ "honcho>=2.0.0,<3" ]
optional-dependencies.reload = [ "django-browser-reload>=1.21.0,<2" ]
urls.Changelog = "https://github.com/timonweb/django-tailwind/blob/master/CHANGELOG.md"
urls.Documentation = "https://django-tailwind.readthedocs.io/"
urls.Homepage = "https://github.com/timonweb/django-tailwind"
urls.Issues = "https://github.com/timonweb/django-tailwind/issues"

[dependency-groups]
dev = [
    "cookiecutter>=2.7.1,<3",
    "django-browser-reload>=1.21.0,<2",
    "honcho>=2.0.0,<3",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.1.1,<10",
    "pytest-django>=4.14.0,<5",
    "tox>=4.65.4,<5",
]
docs = [
    "myst-parser>=4.0.0,<6",
    "sphinx>=8.1.3,<10",
    "sphinx-rtd-theme>=3.1.0,<4",
]
django52 = [
    "django>=5.2,<6",
]
django60 = [ "django>=6.0,<6.1; python_version>='3.12'" ]
django61 = [ "django>=6.1,<6.2; python_version>='3.12'" ]

[tool.hatch]
build.targets.wheel.packages = [ "src/tailwind" ]
build.targets.sdist.include = [ "src/tailwind" ]

[tool.uv]
conflicts = [
    [
        { group = "django52" },
        { group = "django60" },
        { group = "django61" },
    ],
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [ "src", "tests" ]
fix = true
lint.extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "I",   # isort
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
lint.extend-ignore = [
    "E501", # line too long (handled by formatter)
]
lint.per-file-ignores."src/tailwind/app_template_*/**" = [
    "N999", # cookiecutter template directories are not importable module names
]
lint.isort.force-single-line = true
lint.isort.known-first-party = [ "tailwind" ]
lint.isort.order-by-type = false

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
# Django 6.1 does not declare Python 3.15 support yet; it is tested in CI only.
max_supported_python = "3.14"

[tool.pytest]
ini_options.pythonpath = [ "." ]
ini_options.addopts = """\
    --strict-config
    --strict-markers
    --ds=tests.settings
    """
ini_options.xfail_strict = true
ini_options.django_find_project = false
