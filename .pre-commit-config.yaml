ci:
  autoupdate_schedule: monthly

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/crate-ci/typos
  rev: v1.51.1
  hooks:
  - id: typos
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: v2.30.3
  hooks:
  - id: pyproject-fmt
- repo: https://github.com/tox-dev/tox-ini-fmt
  rev: 1.10.0
  hooks:
  - id: tox-ini-fmt
- repo: https://github.com/rstcheck/rstcheck
  rev: v6.3.0
  hooks:
  - id: rstcheck
    additional_dependencies:
    - tomli==2.5.0
- repo: https://github.com/adamchainz/django-upgrade
  rev: 1.33.0
  hooks:
  - id: django-upgrade
- repo: https://github.com/adamchainz/blacken-docs
  rev: 1.20.0
  hooks:
  - id: blacken-docs
    additional_dependencies:
    - black==26.10.1
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.2
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
exclude: 'src/tailwind/app_template_v3/{{cookiecutter.app_name}}/apps.py|src/tailwind/app_template_v4/{{cookiecutter.app_name}}/apps.py|src/tailwind/app_template_v4/{{cookiecutter.app_name}}/static_src/package.json|src/tailwind/app_template_v4_standalone/{{cookiecutter.app_name}}/apps.py'
