[tox]
requires =
    tox>=4.2
env_list =
    py315-django61
    py314-django{61, 60, 52}
    py313-django{61, 60, 52}
    py312-django{61, 60, 52}
    py311-django52

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
set_env =
    PYTHONDEVMODE = 1
commands =
    python \
      -W error::ResourceWarning \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m pytest {posargs:tests}
dependency_groups =
    dev
    django52: django52
    django60: django60
    django61: django61
