# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

# Installs the "docs" dependency group from pyproject.toml, pinned by uv.lock.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
